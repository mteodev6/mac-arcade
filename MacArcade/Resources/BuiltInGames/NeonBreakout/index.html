<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Breakout - Synthwave Arcade</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0718;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        #canvas-wrapper {
            position: relative;
            box-shadow: 0 0 40px rgba(255, 0, 127, 0.35);
            border-radius: 6px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background-color: #0d081f;
        }
        #instructions {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 0, 127, 0.8);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            pointer-events: none;
            text-align: center;
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.6);
        }
    </style>
</head>
<body>
    <div id="canvas-wrapper">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="instructions">MOUSE OR LEFT/RIGHT / A/D : PADDLE &bull; SPACE : LAUNCH &bull; P : PAUSE</div>
    </div>
    <script src="game.js"></script>
</body>
</html>
